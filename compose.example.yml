services:
  subtitle-agent:
    image: ghcr.io/kcn3333/subtitle-agent:latest
    container_name: subtitle-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Subtitle Agent
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      LOG_LEVEL: INFO
      DATA_ROOT: /data
      SUBTITLE_AGENT_MEDIA_ROOTS: /media/movies:/media/shows
      MAX_CONCURRENT_JOBS: 1
      FFPROBE_TIMEOUT_SECONDS: 30
      FFMPEG_TIMEOUT_SECONDS: 600
      ALIGNMENT_MIN_SCALE: 0.94
      ALIGNMENT_MAX_SCALE: 1.06
      ALIGNMENT_MAX_SEGMENTS: 3
      ALIGNMENT_MIN_POINTS_PER_SEGMENT: 4
      ALIGNMENT_END_TOLERANCE_MS: 1000
      OPENAI_SEMANTIC_ALIGNMENT_ENABLED: "false"
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_REASONING_EFFORT: low
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      TZ: Europe/Warsaw
    volumes:
      - subtitle_agent_data:/data
      - /media/movies:/media/movies:ro
      - /media/shows:/media/shows:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - openai_api_key
volumes:
  subtitle_agent_data:
secrets:
  openai_api_key:
    file: ./secrets/openai_api_key
