# Overlay: docker compose -f compose.example.yml -f compose.semantic-cpu.yml --profile local-ai ...
services:
  subtitle-agent:
    image: subtitle-agent:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      LOCAL_WORKER_URL: http://subtitle-semantic-worker:8091
      LOCAL_WORKER_TOKEN_FILE: /run/secrets/semantic_token
      LOCAL_WORKER_BATCH_SIZE: ${LOCAL_WORKER_BATCH_SIZE:-32}
      LOCAL_WORKER_TIMEOUT_SECONDS: ${LOCAL_WORKER_TIMEOUT_SECONDS:-120}
      LOCAL_CPU_FALLBACK_ENABLED: "false"
    secrets: [semantic_token]
  subtitle-semantic-worker:
    profiles: [local-ai]
    image: subtitle-semantic:cpu
    build:
      context: .
      dockerfile: Dockerfile.semantic
      target: cpu
    restart: unless-stopped
    environment:
      AI_DEVICE: cpu
      AI_DTYPE: float32
      AI_THREADS: ${AI_THREADS:-2}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-16}
      AI_TOKEN_FILE: /run/secrets/semantic_token
      AI_REQUEST_TIMEOUT_SECONDS: ${LOCAL_WORKER_TIMEOUT_SECONDS:-120}
      AI_MAX_REQUEST_BYTES: 1048576
      HF_HOME: /cache
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: ${AI_THREADS:-2}
      MKL_NUM_THREADS: ${AI_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${AI_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    volumes: [semantic_model_cache:/cache]
    secrets: [semantic_token]
    expose: ["8091"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
volumes:
  semantic_model_cache:
secrets:
  semantic_token:
    file: ${SEMANTIC_TOKEN_FILE:?Set path to existing token file outside repository}
