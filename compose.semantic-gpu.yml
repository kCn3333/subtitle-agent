# Standalone on the GPU host; no media, app DB or /data mount.
services:
  subtitle-semantic-worker:
    image: subtitle-semantic:cuda
    build:
      context: .
      dockerfile: Dockerfile.semantic
      target: cuda
    restart: unless-stopped
    environment:
      AI_DEVICE: cuda
      AI_DTYPE: ${AI_DTYPE:-float32}
      AI_THREADS: ${AI_THREADS:-2}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-16}
      AI_TOKEN_FILE: /run/secrets/semantic_token
      AI_MAX_REQUEST_BYTES: 1048576
      AI_REQUEST_TIMEOUT_SECONDS: ${LOCAL_WORKER_TIMEOUT_SECONDS:-120}
      HF_HOME: /cache
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: ${AI_THREADS:-2}
      MKL_NUM_THREADS: ${AI_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${AI_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "${AI_LAN_BIND_ADDRESS:?Set trusted LAN interface address}:${AI_LAN_PORT:?Set worker port}:8091"
    volumes: [semantic_model_cache:/cache]
    secrets: [semantic_token]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
volumes:
  semantic_model_cache:
secrets:
  semantic_token:
    file: ${SEMANTIC_TOKEN_FILE:?Set path to existing token file outside repository}
