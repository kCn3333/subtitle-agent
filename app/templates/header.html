<header class="app-header">
  <div class="brand-row">{% include 'brand.html' %}<div class="health-group"><span class="health">● ONLINE</span><span id="ocr-health" class="health health-checking">● OCR SPRAWDZANIE</span><span id="api-health" class="health health-checking" aria-live="polite">● API SPRAWDZANIE</span></div></div>
  <nav class="app-nav" aria-label="Nawigacja aplikacji">
