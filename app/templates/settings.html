<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ustawienia AI · {{ app_name }}</title><link rel="stylesheet" href="/static/styles.css?v=console-health-1"><link rel="stylesheet" href="/static/fontawesome/css/fontawesome.min.css"><link rel="stylesheet" href="/static/fontawesome/css/solid.min.css"></head>
<body><main>{% include 'header.html' %}
<section class="card"><h2><i class="fa-solid fa-gear" aria-hidden="true"></i> Ustawienia AI</h2><form id="ai-settings">
<div class="settings-fields">
<label class="field-wide">Adres API <input id="api-url" type="url" required placeholder="http://serwer-modelu:8000/v1" maxlength="2048"></label>
<label>Nazwa modelu <input id="model" required maxlength="200"></label>
<label>Timeout (sekundy) <input id="timeout" type="number" min="1" max="3600" required value="120"></label>
<label class="field-wide">Klucz API (opcjonalny) <input id="api-key" type="password" autocomplete="new-password" placeholder="Puste pole zachowuje zapisany klucz"></label>
<div class="field-wide key-options"><span id="key-status"></span><label><input id="clear-key" type="checkbox"> Usuń zapisany klucz</label></div>
<label>Reasoning effort <span class="select-wrap"><select id="reasoning-effort">
  <option value="">domyślne modelu</option><option value="none">wyłączone (none)</option>
  <option value="minimal">minimalne (minimal)</option><option value="low">niskie (low)</option>
  <option value="medium">średnie (medium)</option><option value="high">wysokie (high)</option>
  <option value="xhigh">bardzo wysokie (xhigh)</option><option value="max">maksymalne (max)</option>
</select></span><small>Obsługa poziomów i wyłączenia zależy od wybranego modelu.</small></label>
<label>Limit tokenów wyjścia (opcjonalny) <input id="max-output-tokens" type="number" min="1" max="2000000" step="1" placeholder="domyślne API"><small>Obejmuje reasoning i wynik. Nie zwiększa maksimum modelu.</small></label>
<label>Format odpowiedzi <span class="select-wrap"><select id="response-format">
  <option value="">domyślne API</option><option value="json_object">JSON</option>
</select></span></label>
</div><div class="row form-actions"><button type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Zapisz</button><button type="button" id="test-api"><i class="fa-solid fa-plug" aria-hidden="true"></i> Zapisz i testuj połączenie</button></div>
<p id="settings-status" role="status"></p>
</form></section>
<section class="console-card" aria-label="Konsola AI"><div class="console-head">
  <button id="clear-ai-console" type="button"><i class="fa-solid fa-trash-can" aria-hidden="true"></i> Wyczyść</button>
  <button type="button" data-copy-console="ai-console"><i class="fa-solid fa-copy" aria-hidden="true"></i> Kopiuj</button></div>
  <p id="ai-console-state" class="sr-only" role="status"></p>
  <div id="ai-console" class="console" tabindex="0" aria-label="Historia komunikatów i odpowiedzi modelu"></div>
</section><footer>kCn &amp; Codex 2026</footer></main><script src="/static/header.js?v=console-health-1"></script><script src="/static/ai-metrics.js?v=console-health-1"></script><script src="/static/settings.js?v=reasoning-control-1"></script><script src="/static/console-tools.js?v=gui-compact-2"></script></body></html>
