<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ustawienia lokalnego AI</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main class="shell"><header><h1>Ustawienia lokalnego AI</h1><a href="/">← Zadania napisów</a></header>
<section class="card"><form id="ai-settings">
<label>Wariant modelu<select id="ai-mode"><option value="disabled">Wyłączony</option><option value="cpu">CPU w stacku aplikacji</option><option value="lan_gpu">GPU na innej maszynie w LAN</option></select></label>
<p id="ai-model"></p>
<div id="lan-config" hidden><label>URL workera GPU<input id="lan-url" type="url" placeholder="http://adres-maszyny:port"></label>
<label><input id="cpu-fallback" type="checkbox"> W razie niedostępności GPU użyj CPU w stacku</label></div>
<p>CPU i GPU używają tego samego modelu oraz algorytmu. Zmiana dotyczy kolejnych zadań. Uruchomione zadanie zachowuje swój wybór.</p>
<p>Token połączenia jest ustawiany podczas uruchomienia stacka. Ta strona pokazuje tylko, czy jest skonfigurowany.</p>
<p id="token-state"></p><button type="submit">Zapisz ustawienia</button><button type="button" id="check-worker">Sprawdź wybrany worker</button>
<p id="settings-status" role="status" aria-live="polite"></p></form></section></main><script src="/static/settings.js"></script></body></html>
