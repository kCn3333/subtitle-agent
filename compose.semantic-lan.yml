# App-side overlay when the worker runs on the GPU machine.
services:
  subtitle-agent:
    image: subtitle-agent:local
    build:
      context: .
      target: runtime
    environment:
      LOCAL_WORKER_URL: ${LOCAL_WORKER_URL:?Set trusted LAN worker URL}
      LOCAL_WORKER_TOKEN_FILE: /run/secrets/semantic_token
      LOCAL_CPU_FALLBACK_ENABLED: "false"
    secrets: [semantic_token]
secrets:
  semantic_token:
    file: ${SEMANTIC_TOKEN_FILE:?Set path to existing token file outside repository}
